[project]
name = "english-assessment-systems"
version = "0.1.0"
description = "Shared Python workspace for Creverse assessment portfolio modules"
requires-python = ">=3.13,<3.14"
dependencies = [
    "presentation-attitude-assessment",
    "writing-data-synthesis",
]

[tool.uv]
package = false

[tool.uv.sources]
presentation-attitude-assessment = { workspace = true }
writing-data-synthesis = { workspace = true }

[tool.uv.workspace]
members = ["presentation_attitude_assessment", "writing_data_synthesis"]
